<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SalimTeaches — Unit 2 Reading</title>
<style>
:root{
  --primary:#5865f2;
  --primary-dark:#4652d9;
  --bg:#f5f7fb;
  --card:#fff;
  --text:#172033;
  --muted:#747d91;
  --border:#e8ebf2;
  --good:#149b66;
  --goodbg:#e9f8f1;
  --bad:#d84a4a;
  --badbg:#fff0f0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.app{max-width:760px;margin:auto;padding-bottom:110px}
.header{padding:24px 18px 14px}
.brand{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--primary)}
h1{font-size:27px;margin:7px 0 5px}
.subtitle{color:var(--muted);font-size:14px;line-height:1.45;margin:0}
.progress-wrap{
  position:sticky;top:53px;z-index:10;background:rgba(245,247,251,.94);
  backdrop-filter:blur(10px);padding:9px 18px 12px;border-bottom:1px solid var(--border)
}
.progress-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:7px}
.progressbar{height:7px;background:#e4e7ef;border-radius:10px;overflow:hidden}
.progressfill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#7c83f5);transition:.3s}

.section{
  margin:14px 14px 0;background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:18px;box-shadow:0 5px 20px rgba(20,30,60,.04)
}
.section-head{
  background:linear-gradient(135deg,#5865f2,#747cf5);color:#fff;
  border-radius:17px;padding:15px;margin-bottom:15px
}
.section-code{font-size:11px;font-weight:800;opacity:.85;letter-spacing:.5px}
.section-title{font-size:19px;font-weight:800;margin-top:3px}
.section-desc{font-size:13px;opacity:.92;margin-top:5px;line-height:1.45}

.audio-card{
  background:#f7f8ff;border:1px solid #e1e4ff;border-radius:16px;
  padding:14px;margin-bottom:16px
}
.audio-title{font-weight:800;font-size:15px;margin-bottom:9px}
.audio-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
audio{width:100%;height:42px}

.question{
  padding:15px 0;border-top:1px solid #edf0f5
}
.question:first-of-type{border-top:0}
.qnum{
  display:inline-flex;width:29px;height:29px;border-radius:9px;
  background:#eef0ff;color:var(--primary);align-items:center;justify-content:center;
  font-size:12px;font-weight:800;margin-right:8px;vertical-align:middle
}
.qprompt{font-size:15px;line-height:1.5;font-weight:650;margin-bottom:11px}
.choices{display:grid;gap:8px}
.choice{
  width:100%;border:1px solid #dfe3ec;background:#fbfcfe;color:var(--text);
  border-radius:12px;padding:12px;font-size:14px;font-weight:650;text-align:left;
  min-height:46px;cursor:pointer
}
.choice.selected{border-color:var(--primary);background:#eef0ff;color:var(--primary)}
.choice.correct{border-color:#bfead6;background:var(--goodbg);color:var(--good)}
.choice.wrong{border-color:#ffd0d0;background:var(--badbg);color:var(--bad)}

.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf{
  border:1px solid #dfe3ec;background:#fbfcfe;border-radius:11px;
  padding:11px;text-align:center;font-weight:750;cursor:pointer
}
.tf.selected{border-color:var(--primary);background:#eef0ff;color:var(--primary)}
.tf.correct{border-color:#bfead6;background:var(--goodbg);color:var(--good)}
.tf.wrong{border-color:#ffd0d0;background:var(--badbg);color:var(--bad)}

input[type="text"]{
  width:100%;border:1px solid #dfe3ec;background:#fbfcfe;border-radius:11px;
  padding:12px;font-size:15px;color:var(--text);outline:none
}
input[type="text"]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(88,101,242,.1)}
input.correct{border-color:#bfead6;background:var(--goodbg)}
input.wrong{border-color:#ffd0d0;background:var(--badbg)}

.feedback{
  display:none;margin-top:9px;border-radius:10px;padding:9px 10px;
  font-size:12px;line-height:1.45
}
.feedback.good{display:block;background:var(--goodbg);color:var(--good)}
.feedback.bad{display:block;background:var(--badbg);color:var(--bad)}

.actions{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.96);border-top:1px solid
